<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf5e9" />
    <meta name="description" content="汽车小镇：带上爱车，在六个地点数一数、搭一搭、讲故事和动手创作。" />
    <title>汽车小镇 · CarPlayground</title>
    <style>
      .entry-loading { min-height: 100svh; display: grid; place-items: center; background: #faf5e9; }
      .entry-loading[hidden] { display: none; }
      .entry-retry { padding: 32px; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.8; color: #294b3d; }
      .entry-retry a { color: inherit; }
    </style>
    <script>
      // Keep recovery out of the normal loading screen; show it only if the entry module fails.
      window.addEventListener('error', function (event) {
        if (event.target instanceof HTMLScriptElement && event.target.type === 'module') {
          var loading = document.getElementById('entry-loading');
          var retry = document.getElementById('entry-retry');
          if (loading && retry) {
            loading.hidden = true;
            retry.hidden = false;
            retry.querySelector('a').addEventListener('click', function (event) {
              event.preventDefault();
              window.location.reload();
            });
          }
        }
      }, true);
    </script>
    <link rel="icon" type="image/webp" href="data:application/x-town-car," />
  </head>
  <body>
    <div id="root">
      <div id="entry-loading" class="entry-loading" role="status" aria-label="正在准备小车">
        <img width="78" height="78" src="data:application/x-town-car-preview," alt="" />
      </div>
      <div id="entry-retry" class="entry-retry" role="alert" hidden><img width="64" height="64" src="data:application/x-town-car-preview," alt="" /><p>连接暂时中断，请再试一次。</p><a href="./index.html#/explore">重新打开汽车小镇</a></div>
    </div>
    <noscript><style>.entry-loading { display: none; }</style><div class="entry-retry"><p>请开启 JavaScript，才能看车和玩游戏。</p><a href="./index.html#/explore">重新打开汽车小镇</a></div></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
