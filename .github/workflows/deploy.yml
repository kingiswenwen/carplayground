name: Check and deploy CarPlayground

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select:
    name: Select CI event
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          run=true
          if [ "$EVENT" = push ] && [ "$BRANCH" = dev ]; then
            # Only replace a dev push with a PR run that this workflow handles.
            if count=$(gh api --method GET "repos/$GH_REPO/pulls" -f state=open -f head="${GH_REPO%%/*}:dev" --paginate --jq '[.[] | select(.base.ref == "main" or .base.ref == "dev")] | length'); then
              if [ "$(printf '%s\n' "$count" | awk '{s += $1} END {print s+0}')" -gt 0 ]; then run=false; fi
            else
              echo '::warning::PR lookup failed; keeping the full push check'
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    if: needs.select.outputs.run == 'true'
    concurrency:
      group: check-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    name: Prepare release and run core checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      release_id: ${{ steps.package.outputs.release_id }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        timeout-minutes: 5
        run: npm ci --registry=https://registry.npmjs.org --no-audit --fund=false --loglevel=info --fetch-timeout=30000 --fetch-retries=2
      - name: Check public source boundary
        run: python scripts/check-public-source.py --history HEAD
      - name: Unit tests
        run: npm test
      - name: Release tool integration tests
        run: npm run test:release
      - name: Use Ubuntu archive for dependency downloads
        run: |
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then
              sudo sed -Ei 's|https?://([a-zA-Z0-9-]+\.)*archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-carplayground-ci > /dev/null
      - name: Install audio test processor
        timeout-minutes: 12
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Install deployment test dependencies
        run: python -m pip install -r deployment/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Prepare immutable release
        id: package
        shell: bash
        run: |
          release_id="app-$(node -p "require('./package.json').version")-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          npm run release:prepare -- --id "$release_id" --kind review
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Install Playwright browsers and dependencies
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium firefox
      - name: Install Firefox software WebGL display
        timeout-minutes: 10
        run: sudo apt-get install -y --no-install-recommends libgl1-mesa-dri libegl1 libglx-mesa0 mesa-utils xvfb xauth
      - name: Verify isolated development preview
        shell: bash
        env:
          DEV_SECURITY_E2E: '1'
          PLAYWRIGHT_HTML_OUTPUT_DIR: test-results/reports/dev-security
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5195
        run: |
          npm run dev -- --host 127.0.0.1 --port 5195 --strictPort &
          dev_pid=$!
          trap 'kill "$dev_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$PLAYWRIGHT_BASE_URL/" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$PLAYWRIGHT_BASE_URL/" > /dev/null
          npx playwright test tests/e2e/dev-security.spec.ts --project=chromium --workers=1 --output=test-results/dev-security
      - name: Firefox WebGL environment
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5194
          RELEASE_ID: ${{ steps.package.outputs.release_id }}
        run: |
          bash scripts/ci-browser-suite.sh PLAYWRIGHT_FIREFOX_SOFTWARE_WEBGL=1 LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1920x1200x24' npx playwright test tests/e2e/firefox-webgl-environment.spec.ts --project=firefox --workers=1 --max-failures=1 --output=test-results/firefox-webgl-probe
      - name: Firefox strict gameplay
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5194
          RELEASE_ID: ${{ steps.package.outputs.release_id }}
        run: |
          bash scripts/ci-browser-suite.sh PLAYWRIGHT_FIREFOX_SOFTWARE_WEBGL=1 LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1920x1200x24' npx playwright test tests/e2e/difficulty.spec.ts tests/e2e/content-level.spec.ts tests/e2e/wash-state.spec.ts tests/e2e/tracks-continuity.spec.ts --project=firefox --workers=1 --max-failures=1 --output=test-results/firefox-strict
      - name: Chromium persistence
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5194
          RELEASE_ID: ${{ steps.package.outputs.release_id }}
        run: |
          bash scripts/ci-browser-suite.sh npx playwright test tests/e2e/core-records-favorites.spec.ts --project=chromium --workers=1 --output=test-results/chromium-core
      - name: Chromium WebGL fallback
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5194
          RELEASE_ID: ${{ steps.package.outputs.release_id }}
        run: |
          bash scripts/ci-browser-suite.sh npx playwright test tests/e2e/pictorial-3d.spec.ts --project=chromium --workers=1 --grep 'WebGL不可用时' --output=test-results/chromium-viewer-fallback
      - name: Chromium repeated scroll regression
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5194
          RELEASE_ID: ${{ steps.package.outputs.release_id }}
        run: |
          bash scripts/ci-browser-suite.sh npx playwright test tests/e2e/showroom-garage-feedback.spec.ts --project=chromium --workers=2 --grep '选车后看见新模型' --repeat-each=3 --output=test-results/chromium-scroll
      - name: Firefox headless flows
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5194
          RELEASE_ID: ${{ steps.package.outputs.release_id }}
        run: |
          bash scripts/ci-browser-suite.sh npx playwright test tests/e2e/responsive-ui.spec.ts tests/e2e/direct-touch.spec.ts tests/e2e/play-guidance.spec.ts --project=firefox --workers=2 --grep '三段故事和控件适配|车型分页和家长说明|推车松手|两路同推|洗车依次' --output=test-results/firefox-headless-2d
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: .release-artifacts/${{ steps.package.outputs.release_id }}/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure() || cancelled()
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14

  chromium:
    name: Chromium full suite (${{ matrix.shard }}/6)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    concurrency:
      group: chromium-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        timeout-minutes: 5
        run: npm ci --registry=https://registry.npmjs.org --no-audit --fund=false --loglevel=info --fetch-timeout=30000 --fetch-retries=2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: .release-artifacts/${{ needs.build.outputs.release_id }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Chromium browser shard
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5194
          RELEASE_ID: ${{ needs.build.outputs.release_id }}
          SHARD: ${{ matrix.shard }}
        run: bash scripts/ci-browser-suite.sh npx playwright test --project=chromium --workers=2 --retries=1 --shard="$SHARD/6" --output=test-results/chromium-full
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure() || cancelled()
        with:
          name: chromium-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  check:
    name: Test and build
    needs: [select, build, chromium]
    if: always() && needs.select.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_id: ${{ needs.build.outputs.release_id }}
      artifact_name: ${{ needs.build.outputs.artifact_name }}
    steps:
      - name: Require the release build and every Chromium shard
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CHROMIUM_RESULT: ${{ needs.chromium.result }}
        run: test "$BUILD_RESULT" = success && test "$CHROMIUM_RESULT" = success

  deploy:
    name: Deploy COS and verify CDN
    needs: check
    if: github.repository == 'kingiswenwen/carplayground' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
    concurrency:
      group: carplayground-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Reject superseded runs before cloud access
        shell: bash
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.check.outputs.artifact_name }}
          path: .release-artifacts/${{ needs.check.outputs.release_id }}
      - run: python -m pip install -r deployment/requirements.txt
      - name: Load private deployment configuration
        shell: bash
        env:
          CLOUD_CONFIG: ${{ secrets.CARPLAYGROUND_CLOUD_CONFIG }}
          OIDC_CONFIG: ${{ secrets.CARPLAYGROUND_OIDC_CONFIG }}
          AUTOMATION_CONFIG: ${{ secrets.CARPLAYGROUND_AUTOMATION_CONFIG }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP']) / 'carplayground-deployment'
          folder.mkdir(mode=0o700)
          for name, variable in [('tencent-cloud', 'CLOUD_CONFIG'), ('tencent-oidc', 'OIDC_CONFIG'), ('automation', 'AUTOMATION_CONFIG')]:
              config = json.loads(os.environ[variable])
              for value in config.values():
                  if isinstance(value, str) and value:
                      escaped = value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::add-mask::' + escaped)
              file = folder / (name + '.json')
              with os.fdopen(os.open(file, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'w') as output:
                  json.dump(config, output)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('CARPLAYGROUND_DEPLOYMENT_DIR=' + str(folder) + '\n')
          PY
      - name: Deploy using short-lived project identity
        shell: bash
        env:
          RELEASE_ID: ${{ needs.check.outputs.release_id }}
        run: |
          credentials="$RUNNER_TEMP/carplayground-credentials.json"
          trap 'rm -f "$credentials"' EXIT
          python scripts/github-oidc-credentials.py "$credentials"
          python scripts/deploy-tencent-release.py ".release-artifacts/$RELEASE_ID" \
            --execute --publish --auto-current-index --authorized-review --workers 8 \
            --credentials-file "$credentials"
      - name: Verify public CDN entry and audio
        env:
          RELEASE_ID: ${{ needs.check.outputs.release_id }}
        run: python scripts/check-deployed-release.py ".release-artifacts/$RELEASE_ID"
      - name: Remove private deployment configuration
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/carplayground-deployment"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: deployment-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .release-artifacts/deployment-*/receipt.json
            .release-artifacts/public-delivery-check.json
          if-no-files-found: warn
          retention-days: 90
